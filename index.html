<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>AI 幾何辨識 - 進階圖案版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            background: #121212;
            overflow: hidden;
            font-family: 'Segoe UI', '微軟正黑體', sans-serif;
        }

        #input_video {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.15;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(25, 25, 25, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: white;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #res {
            font-size: 36px;
            color: #00ffcc;
            font-weight: 800;
            display: block;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        #confidence {
            display: block;
            color: #8ce6ff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        #explanation {
            color: #cfd8dc;
            font-size: 13px;
            line-height: 1.5;
            min-height: 20px;
            max-width: 320px;
            word-break: break-word;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        #indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
        }

        button {
            background: linear-gradient(135deg, #00ffcc, #00aba9);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
            color: #121212;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }

        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {
            .ui {
                left: 10px;
                right: 10px;
                min-width: auto;
                width: calc(100% - 20px);
                padding: 16px;
            }

            #res {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <img id="input_video" autoplay playsinline></img>
    <div class="ui">
        <div class="status-box">
            <div id="indicator"></div>
            <span id="state_text">等待相機權限...</span>
        </div>
        <span>辨識結果：</span>
        <span id="res">---</span>
        <span id="confidence">信心度：--%</span>
        <div id="explanation">判斷依據：---</div>
        <button onclick="startCapture()">啟動螢幕 / 相機擷取</button>
        <div class="hint">
            • <b>繪製：</b>伸出食指 (其他手指收起)<br>
            • <b>停止/辨識：</b>張開手掌 (五指伸展)<br>
            • <b>支援：</b>直線、圓形、正方形、三角形、愛心
        </div>
    </div>

    <script>
        let hands, pg, path = [], handResults = null, isDrawing = false, hasAnalyzedCurrentPath = false;
        const imgElement = document.getElementById('input_video');

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pg = createGraphics(windowWidth, windowHeight);
            pg.stroke(0, 255, 204);
            pg.strokeWeight(8);
            pg.strokeCap(ROUND);
            pg.strokeJoin(ROUND);

            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.7 });
            hands.onResults(r => handResults = r.multiHandLandmarks);
        }

        // 前端修正
        async function startCapture() {
            // 不再需要 navigator.mediaDevices.getUserMedia
            // 直接將 proxy URL 設定給 video 標籤
            imgElement.crossOrigin = "anonymous"; // 避免畫布污染 (Canvas Tainting)
            imgElement.src = "http://localhost:3000/video_feed";

            imgElement.onload = () => {
                const loop = async () => {
                    if (!imgElement.paused) await hands.send({ image: imgElement });
                    requestAnimationFrame(loop);
                };
                loop();
            };
        }

        function draw() {
            clear();
            image(pg, 0, 0);

            if (handResults && handResults.length > 0) {
                let pts = handResults[0];
                let x = (1 - pts[8].x) * width;
                let y = pts[8].y * height;

                // --- 核心修改：手勢判斷邏輯 ---
                
                // 1. 食指伸直 (繪製模式)：食指尖(8) 高於 食指根(6)，且中指尖(12) 低於 中指根(10) [代表只有食指伸出]
                let isPointing = pts[8].y < pts[6].y && pts[12].y > pts[10].y;

                // 2. 五指伸開 (停止/辨識模式)：大拇指到小拇指的尖端都處於伸展狀態
                // 簡化判斷：食指(8)、中指(12)、無名指(16)、小指(20) 的 y 座標都小於其對應的第二關節
                let isFiveFingers = pts[8].y < pts[6].y && 
                                    pts[12].y < pts[10].y && 
                                    pts[16].y < pts[14].y && 
                                    pts[20].y < pts[18].y;

                const indicator = document.getElementById('indicator');
                const stateText = document.getElementById('state_text');

                if (isPointing) {
                    // 進入繪製狀態
                    indicator.style.background = "#00ffcc";
                    indicator.style.boxShadow = "0 0 10px #00ffcc";
                    stateText.innerText = "正在錄製軌跡...";

                    if (!isDrawing) { 
                        path = []; 
                        pg.clear(); 
                        isDrawing = true;
                        hasAnalyzedCurrentPath = false;
                    }

                    if (path.length > 0) {
                        let lastP = path[path.length - 1];
                        x = lerp(lastP.x, x, 0.2);
                        y = lerp(lastP.y, y, 0.2);
                    }

                    path.push({ x, y });
                    if (path.length > 1) {
                        let p = path[path.length - 2];
                        pg.line(p.x, p.y, x, y);
                    }
                } 
                else if (isFiveFingers) {
                    // 偵測到五指伸出：觸發辨識並停止繪製
                    indicator.style.background = "#ff4444";
                    indicator.style.boxShadow = "0 0 10px #ff4444";
                    stateText.innerText = "偵測到辨識手勢！";

                    if (isDrawing && path.length > 20 && !hasAnalyzedCurrentPath) {
                        analyzeShape(path);
                        hasAnalyzedCurrentPath = true;
                    }
                    isDrawing = false;
                }
                else {
                    // 其他手勢 (如握拳)：靜止狀態
                    indicator.style.background = "orange";
                    indicator.style.boxShadow = "0 0 10px orange";
                    stateText.innerText = "等待指令 (食指繪製 / 五指辨識)";
                    isDrawing = false; 
                }

                // 繪製指尖游標
                fill(255);
                noStroke();
                ellipse(x, y, 12, 12);
                noFill();
                stroke(0, 255, 204);
                ellipse(x, y, 20, 20);
            }
        }
        function analyzeShape(rawPoints) {
            if (!rawPoints || rawPoints.length < 20) {
                showPrediction("⚠️ 圖案太短", 0, ["點數不足，請畫完整軌跡"]);
                return;
            }

            const pts = smoothPoints(rawPoints, 2);
            const xs = pts.map(p => p.x);
            const ys = pts.map(p => p.y);

            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);
            const width = maxX - minX;
            const height = maxY - minY;
            const diagonal = Math.hypot(width, height);

            if (diagonal < 25) {
                showPrediction("⚠️ 圖案太小", 5, ["尺寸過小，特徵不穩定"]);
                return;
            }

            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;
            const pathLength = getPathLength(pts);
            const closingDistance = distance(pts[0], pts[pts.length - 1]);
            const closureRatio = 1 - Math.min(1, closingDistance / Math.max(1, diagonal * 0.3));

            const isClosed = closingDistance < Math.max(35, diagonal * 0.22) && pathLength > diagonal * 1.5;

            const lineError = maxDistanceFromLine(pts, pts[0], pts[pts.length - 1]);
            const lineErrorRatio = lineError / Math.max(1, diagonal);
            const straightness = clamp(1 - lineErrorRatio * 4, 0, 1);
            const pathVsDiagonal = pathLength / Math.max(1, diagonal);

            if (!isClosed && lineError < Math.max(18, diagonal * 0.12) && pathVsDiagonal < 1.35) {
                const confidence = 60 + 30 * straightness + 10 * clamp(1.35 - pathVsDiagonal, 0, 0.35) / 0.35;
                showPrediction("📏 直線 (Line)", confidence, [
                    `線性誤差低 (${Math.round(lineError)}px)`,
                    `路徑接近端點連線 (${pathVsDiagonal.toFixed(2)})`
                ]);
                return;
            }

            if (!isClosed) {
                showPrediction("🎨 自由曲線", 45 + 25 * (1 - straightness), [
                    `閉合度較低 (${Math.round(closureRatio * 100)}%)`,
                    `路徑彎曲度較高`
                ]);
                return;
            }

            const area = Math.abs(polygonArea(pts));
            const perimeter = Math.max(pathLength, 1);
            const circularity = (4 * Math.PI * area) / (perimeter * perimeter);
            const aspectRatio = width / Math.max(height, 1);

            const radii = pts.map(p => Math.hypot(p.x - centerX, p.y - centerY));
            const averageRadius = radii.reduce((sum, value) => sum + value, 0) / radii.length;
            const radiusDeviation = Math.sqrt(
                radii.reduce((sum, value) => sum + Math.pow(value - averageRadius, 2), 0) / radii.length
            );
            const radiusVariation = averageRadius > 0 ? radiusDeviation / averageRadius : 1;

            const topBand = pts.filter(p => p.y < minY + height * 0.42);
            const leftTop = topBand.filter(p => p.x < centerX - width * 0.08);
            const rightTop = topBand.filter(p => p.x > centerX + width * 0.08);
            const centerTop = topBand.filter(p => Math.abs(p.x - centerX) <= width * 0.12);
            const bottomBand = pts.filter(p => p.y > maxY - height * 0.22);

            const leftLobeY = leftTop.length > 0 ? Math.min(...leftTop.map(p => p.y)) : minY;
            const rightLobeY = rightTop.length > 0 ? Math.min(...rightTop.map(p => p.y)) : minY;
            const cleftY = centerTop.length > 0 ? Math.max(...centerTop.map(p => p.y)) : minY;
            const lobeY = (leftLobeY + rightLobeY) / 2;
            const cleftDepth = cleftY - lobeY;
            const normalizedCleft = clamp(cleftDepth / Math.max(1, height * 0.2), 0, 1);

            const bottomCenter = bottomBand.length > 0
                ? bottomBand.reduce((sum, p) => sum + p.x, 0) / bottomBand.length
                : centerX;
            const bottomCenterOffset = Math.abs(bottomCenter - centerX) / Math.max(1, width);
            const bottomCenterScore = clamp(1 - bottomCenterOffset / 0.25, 0, 1);
            const hasTwoTopLobes = leftTop.length >= 2 && rightTop.length >= 2;

            const heartScore = (
                0.32 * normalizedCleft +
                0.22 * (hasTwoTopLobes ? 1 : 0) +
                0.16 * bottomCenterScore +
                0.15 * clamp(1 - Math.abs(aspectRatio - 1), 0, 1) +
                0.15 * clamp(closureRatio, 0, 1)
            );

            const circleScore = (
                0.4 * clamp((circularity - 0.58) / 0.35, 0, 1) +
                0.3 * clamp((0.35 - radiusVariation) / 0.35, 0, 1) +
                0.2 * clamp(1 - Math.abs(aspectRatio - 1) / 0.32, 0, 1) +
                0.1 * clamp(closureRatio, 0, 1)
            );

            const simplified = simplifyRDP(pts, Math.max(8, diagonal * 0.055));
            const cornerCount = countCorners(simplified);

            const triangleCornerScore = clamp(1 - Math.abs(cornerCount - 3) / 2, 0, 1);
            const topIndex = ys.indexOf(minY);
            const apexCentering = clamp(1 - Math.abs(pts[topIndex].x - centerX) / Math.max(1, width * 0.22), 0, 1);
            const bottomPoints = pts.filter(p => p.y > maxY - height * 0.18);
            const bottomWidth = bottomPoints.length > 0
                ? Math.max(...bottomPoints.map(p => p.x)) - Math.min(...bottomPoints.map(p => p.x))
                : 0;
            const baseScore = clamp(bottomWidth / Math.max(1, width * 0.65), 0, 1);
            const triangleScore = (
                0.42 * triangleCornerScore +
                0.27 * apexCentering +
                0.21 * baseScore +
                0.1 * clamp(closureRatio, 0, 1)
            );

            const quadrilateralScore = clamp(1 - Math.abs(cornerCount - 4) / 3, 0, 1);
            const squareAspectScore = clamp(1 - Math.abs(aspectRatio - 1) / 0.28, 0, 1);
            const rectAspectSkew = Math.abs(Math.log(Math.max(aspectRatio, 1 / Math.max(aspectRatio, 0.0001))));
            const rectangleAspectScore = clamp(rectAspectSkew / 0.4, 0, 1) * clamp(1 - rectAspectSkew / 1.4, 0, 1);

            const squareScore = (
                0.45 * quadrilateralScore +
                0.4 * squareAspectScore +
                0.15 * clamp(closureRatio, 0, 1)
            );

            const rectangleScore = (
                0.46 * quadrilateralScore +
                0.32 * rectangleAspectScore +
                0.12 * clamp(1 - squareAspectScore, 0, 1) +
                0.1 * clamp(closureRatio, 0, 1)
            );

            const isCircle = circularity > 0.72 && aspectRatio > 0.72 && aspectRatio < 1.38 && radiusVariation < 0.28;
            if (isCircle && circleScore >= Math.max(heartScore, triangleScore, squareScore, rectangleScore)) {
                showPrediction("⚪ 圓形 (Circle)", 55 + circleScore * 45, [
                    `圓度 ${Math.round(clamp(circularity, 0, 1) * 100)}%`,
                    `半徑變異低 (${radiusVariation.toFixed(2)})`
                ]);
                return;
            }

            const isHeart = hasTwoTopLobes && cleftDepth > height * 0.08 && bottomCenterOffset < 0.25 && aspectRatio > 0.55 && aspectRatio < 1.45;
            if (isHeart && heartScore >= Math.max(triangleScore, squareScore, rectangleScore, circleScore * 0.9)) {
                showPrediction("❤️ 愛心 (Heart)", 52 + heartScore * 48, [
                    `中心凹陷明顯 (${Math.round(normalizedCleft * 100)}%)`,
                    `上下對稱度佳`
                ]);
                return;
            }

            if (cornerCount <= 3 && aspectRatio > 0.55 && aspectRatio < 1.8 && triangleScore >= Math.max(squareScore, rectangleScore)) {
                showPrediction("🔺 三角形 (Triangle)", 50 + triangleScore * 48, [
                    `角點接近 3 個 (${cornerCount})`,
                    `頂點與底邊幾何吻合`
                ]);
                return;
            }

            if (cornerCount <= 5) {
                const isSquare = aspectRatio > 0.78 && aspectRatio < 1.28 && squareScore >= rectangleScore;
                if (isSquare) {
                    showPrediction("⬜ 正方形 (Square)", 50 + squareScore * 45, [
                        `角點接近 4 個 (${cornerCount})`,
                        `寬高比接近 1 (${aspectRatio.toFixed(2)})`
                    ]);
                } else {
                    showPrediction("▭ 矩形 (Rectangle)", 48 + rectangleScore * 45, [
                        `角點接近 4 個 (${cornerCount})`,
                        `寬高比偏長 (${aspectRatio.toFixed(2)})`
                    ]);
                }
                return;
            }

            showPrediction("🎨 自由曲線", 38 + clamp((1 - closureRatio) * 35 + (1 - quadrilateralScore) * 22, 0, 45), [
                `角點數較不規則 (${cornerCount})`,
                `幾何特徵與基本圖形差距較大`
            ]);
        }

        function showPrediction(label, confidence, reasons) {
            const safeConfidence = Math.round(clamp(confidence, 0, 100));
            document.getElementById('res').innerText = label;
            document.getElementById('confidence').innerText = `信心度：${safeConfidence}%`;
            const reasonList = Array.isArray(reasons) && reasons.length > 0 ? reasons.slice(0, 3) : ["特徵不足"];
            document.getElementById('explanation').innerText = `判斷依據：${reasonList.join(" · ")}`;
        }

        function clamp(value, minValue, maxValue) {
            return Math.min(maxValue, Math.max(minValue, value));
        }

        function smoothPoints(points, passes = 2) {
            let result = points.map(p => ({ x: p.x, y: p.y }));

            for (let pass = 0; pass < passes; pass++) {
                result = result.map((point, index) => {
                    if (index === 0 || index === result.length - 1) return point;
                    return {
                        x: (result[index - 1].x + point.x + result[index + 1].x) / 3,
                        y: (result[index - 1].y + point.y + result[index + 1].y) / 3
                    };
                });
            }

            return result;
        }

        function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function getPathLength(points) {
            let length = 0;
            for (let i = 1; i < points.length; i++) {
                length += distance(points[i - 1], points[i]);
            }
            return length;
        }

        function polygonArea(points) {
            let area = 0;
            for (let i = 0; i < points.length; i++) {
                const current = points[i];
                const next = points[(i + 1) % points.length];
                area += current.x * next.y;
                area -= next.x * current.y;
            }
            return area / 2;
        }

        function maxDistanceFromLine(points, start, end) {
            const lineLength = distance(start, end);
            if (lineLength === 0) return Infinity;

            let maxDistance = 0;
            for (const point of points) {
                const crossProduct = Math.abs(
                    (end.x - start.x) * (start.y - point.y) - (start.x - point.x) * (end.y - start.y)
                );
                maxDistance = Math.max(maxDistance, crossProduct / lineLength);
            }
            return maxDistance;
        }

        function simplifyRDP(points, epsilon) {
            if (points.length < 3) return points;

            let maximumDistance = 0;
            let splitIndex = 0;
            const first = points[0];
            const last = points[points.length - 1];

            for (let i = 1; i < points.length - 1; i++) {
                const currentDistance = pointToSegmentDistance(points[i], first, last);
                if (currentDistance > maximumDistance) {
                    maximumDistance = currentDistance;
                    splitIndex = i;
                }
            }

            if (maximumDistance > epsilon) {
                const left = simplifyRDP(points.slice(0, splitIndex + 1), epsilon);
                const right = simplifyRDP(points.slice(splitIndex), epsilon);
                return left.slice(0, -1).concat(right);
            }

            return [first, last];
        }

        function pointToSegmentDistance(point, start, end) {
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            if (dx === 0 && dy === 0) return distance(point, start);

            const t = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy)));
            const projection = { x: start.x + t * dx, y: start.y + t * dy };
            return distance(point, projection);
        }

        function countCorners(points) {
            if (points.length < 4) return points.length;

            let corners = 0;
            for (let i = 1; i < points.length - 1; i++) {
                const previous = points[i - 1];
                const current = points[i];
                const next = points[i + 1];

                const angle1 = Math.atan2(current.y - previous.y, current.x - previous.x);
                const angle2 = Math.atan2(next.y - current.y, next.x - current.x);
                let angleDifference = Math.abs(angle2 - angle1);
                if (angleDifference > Math.PI) angleDifference = 2 * Math.PI - angleDifference;
                if (angleDifference > 0.45) corners++;
            }

            return corners;
        }
    
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            let newPg = createGraphics(windowWidth, windowHeight);
            newPg.image(pg, 0, 0);
            pg = newPg;
        }
    </script>
</body>

</html>
